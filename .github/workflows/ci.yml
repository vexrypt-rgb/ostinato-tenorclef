name: CI (26.3 monorepo)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ostinato-test:
    name: Ostinato tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - run: cd ostinato && chmod +x gradlew && ./gradlew --no-daemon test --stacktrace

  tenorclef-263:
    name: TenorClef 26.3 against Ostinato from source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # TenorClef 26.3 compiles on a JDK 25 toolchain; Gradle and the preprocessor run on 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Build Ostinato, then compile and test TenorClef 26.3
        env:
          GRADLE_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
        run: chmod +x ostinato/gradlew tenorclef/gradlew && scripts/build-263.sh
