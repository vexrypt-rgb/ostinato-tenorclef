name: Release (26.3 monorepo)

# One GitHub release per tag. `ostinato-vX.Y.Z` builds ostinato/ (Fabric jars that carry the Rust library for six
# platforms, proguard on a JDK with jmods); `tenorclef-vX.Y.Z` builds tenorclef/'s 26.3 jar against ostinato/ from
# the same commit. The release text is .github/release-notes/<tag>.md. Adapted from vexrypt-rgb/Ostinato's release.yml.
on:
  push:
    tags: ['ostinato-v*', 'tenorclef-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish, e.g. ostinato-v1.28.0 or tenorclef-v0.29.0'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  natives:
    name: Native ${{ matrix.platform }}
    if: startsWith(github.event.inputs.tag || github.ref_name, 'ostinato-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { platform: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc, lib: ostinato_native.dll, test: true }
          - { platform: windows-aarch64, os: windows-latest, target: aarch64-pc-windows-msvc, lib: ostinato_native.dll }
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, glibc: '.2.17', lib: libostinato_native.so, test: true }
          - { platform: linux-aarch64, os: ubuntu-latest, target: aarch64-unknown-linux-gnu, glibc: '.2.17', lib: libostinato_native.so }
          - { platform: macos-aarch64, os: macos-latest, target: aarch64-apple-darwin, lib: libostinato_native.dylib, test: true }
          - { platform: macos-x86_64, os: macos-latest, target: x86_64-apple-darwin, lib: libostinato_native.dylib }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - if: matrix.glibc
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - if: matrix.glibc
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - name: Unit tests
        if: matrix.test
        shell: bash
        working-directory: ostinato/native
        run: cargo test --release --target ${{ matrix.target }}
      - name: Build
        shell: bash
        working-directory: ostinato/native
        env:
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: |
          if [ -n "${{ matrix.glibc }}" ]; then
            cargo zigbuild --release --target ${{ matrix.target }}${{ matrix.glibc }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
          mkdir -p "$GITHUB_WORKSPACE/natives/${{ matrix.platform }}"
          cp -v target/${{ matrix.target }}/release/${{ matrix.lib }} "$GITHUB_WORKSPACE/natives/${{ matrix.platform }}/"
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.platform }}
          path: natives/
          if-no-files-found: error

  ostinato:
    name: Build Ostinato (MC 26.3)
    needs: natives
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # zulu ships jmods/, which the proguard step reads (Temurin 25 does not)
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '25'
      - uses: actions/download-artifact@v4
        with:
          pattern: natives-*
          path: ostinato/natives-in
          merge-multiple: true
      - name: Build (tests included)
        working-directory: ostinato
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :fabric:build -Pavailable_loaders=fabric -Postinato_natives_dir=natives-in -Postinato_native_require
      - name: Collect jars
        run: |
          ver="${TAG#ostinato-v}"
          mkdir -p out
          shopt -s nullglob
          for f in ostinato/dist/baritone-*-fabric-*.jar; do
            base="$(basename "$f" .jar)"
            case "$base" in *"-$ver") ;; *) echo "jar $base does not carry version $ver"; exit 1 ;; esac
            cp -v "$f" "out/ostinato-mc26.3-${base#baritone-}.jar"
          done
          ls out/*.jar
      - name: Check native libraries
        run: |
          for f in out/*.jar; do
            n=$(unzip -l "$f" | grep -c 'natives/ostinato/.*/.*ostinato_native\.' || true)
            echo "$f: $n native libraries"
            [ "$n" -eq 6 ] || { echo "expected 6"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: jars-ostinato
          path: out/*.jar
          if-no-files-found: error

  tenorclef:
    name: Build TenorClef (MC 26.3)
    if: startsWith(github.event.inputs.tag || github.ref_name, 'tenorclef-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      # TenorClef 26.3 compiles on a JDK 25 toolchain; Gradle and the preprocessor run on 21.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Ostinato from ostinato/, then the TenorClef 26.3 jar against it
        env:
          GRADLE_ARGS: -Porg.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
          TC_TASKS: ':26.3:build -x test'
        run: chmod +x ostinato/gradlew tenorclef/gradlew && scripts/build-263.sh
      - name: Collect jar
        run: |
          mkdir -p out
          for f in tenorclef/versions/26.3/build/libs/*.jar; do
            case "$f" in *-sources.jar|*-dev.jar|*-javadoc.jar|*-slim.jar) continue;; esac
            cp -v "$f" "out/tenorclef-mc26.3-${TAG#tenorclef-}.jar"
          done
          test -n "$(ls out)"
      - uses: actions/upload-artifact@v4
        with:
          name: jars-tenorclef
          path: out/*.jar
          if-no-files-found: error

  publish:
    needs: [ostinato, tenorclef]
    if: always() && (needs.ostinato.result == 'success' || needs.tenorclef.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          path: jars
          merge-multiple: true
      - id: meta
        run: |
          case "$TAG" in
            ostinato-v*) v="${TAG#ostinato-v}"; echo "name=Ostinato v$v" >> "$GITHUB_OUTPUT"; echo "latest=true" >> "$GITHUB_OUTPUT" ;;
            tenorclef-v*) v="${TAG#tenorclef-v}"; echo "name=TenorClef v$v" >> "$GITHUB_OUTPUT"; echo "latest=false" >> "$GITHUB_OUTPUT" ;;
          esac
          case "$v" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac
          test -f ".github/release-notes/$TAG.md"
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ steps.meta.outputs.name }}
          body_path: .github/release-notes/${{ env.TAG }}.md
          prerelease: ${{ steps.meta.outputs.prerelease }}
          make_latest: ${{ steps.meta.outputs.latest }}
          files: jars/*.jar
          fail_on_unmatched_files: true